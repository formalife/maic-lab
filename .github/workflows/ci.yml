name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Generate Prototype 001 grounded artifact
        run: pnpm prototype:001:recorded

      - name: Build Prototype 002 immersive preview
        run: pnpm preview:build

      - name: Upload Prototype 001 grounded artifact
        uses: actions/upload-artifact@v4
        with:
          name: prototype-001-recorded
          path: artifacts/prototype-001-recorded.json
          if-no-files-found: error

      - name: Upload Prototype 002 immersive preview
        uses: actions/upload-artifact@v4
        with:
          name: prototype-002-immersive-preview
          path: preview/dist
          if-no-files-found: error
